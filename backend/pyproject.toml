[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "issue-troubleshooting"
version = "0.2.0"
description = "Internal evidence-based transaction investigation agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3", "PyYAML>=6,<7", "langchain>=1,<2", "langchain-openai>=1,<2", "langgraph>=1,<2", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["troubleshooter*"]
