server {
    listen 80;
    # 轮询和静态资源不记访问流水，关键操作由应用 JSON 日志记录。
    access_log off;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / { try_files $uri $uri/ /index.html; }
}
