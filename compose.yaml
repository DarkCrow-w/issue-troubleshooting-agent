services:
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: true
    command: [alembic, upgrade, head]
  agent:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: true
    expose: ["8001"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: true
    environment:
      AGENT_URL: http://agent:8001
    command: [uvicorn, "troubleshooter.api.public:create_app", --factory, --host, "0.0.0.0", --port, "8000"]
    expose: ["8000"]
    depends_on: [agent]
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
